amcl:
  ros__parameters:
    use_sim_time: false

    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map

    scan_topic: /scan

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99

    update_min_d: 0.10
    update_min_a: 0.10
    resample_interval: 1

    laser_model_type: "likelihood_field"
    max_beams: 60
    laser_min_range: 0.05
    laser_max_range: 16.0
    laser_likelihood_max_dist: 2.0

    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1

    do_beamskip: false

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    tf_broadcast: true
    transform_tolerance: 0.5
    save_pose_rate: 0.5
