; Headless ESP32-WROOM-32 development board valve controller.
; Talks to ROS 2 over micro-ROS/WiFi (UDP) and logs status over USB serial.

[env:esp32-wroom32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; micro-ROS over WiFi/UDP to the micro-ROS agent. Must match the agent's ROS 2 distro.
board_microros_transport = wifi
board_microros_distro = jazzy

; micro-ROS + TFT_eSPI need more flash/IRAM than the default partition table.
board_build.partitions = huge_app.csv

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git
