; PlatformIO project for the ESP32-2432S028R "Cheap Yellow Display" (CYD).
; Status display (CAN bus health, controller active, valve state) + GPIO-driven
; spray valve solenoid, talking to ROS 2 over micro-ROS/WiFi (UDP) to a
; micro-ROS agent running on the PC.

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; micro-ROS over WiFi/UDP to the micro-ROS agent. Must match the agent's ROS 2 distro.
board_microros_transport = wifi
board_microros_distro = jazzy
; Raises RMW_UXRCE_MAX_SUBSCRIPTIONS (default 5) for the bus voltage/error topics.
board_microros_user_meta = user.meta

; micro-ROS + TFT_eSPI need more flash/IRAM than the default partition table.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/micro-ROS/micro_ros_platformio.git

; TFT_eSPI "no-config" build: define the panel/pins here instead of editing the
; library's User_Setup.h. This matches the common ESP32-2432S028R (ILI9341, 240x320) wiring.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DSMOOTH_FONT=1
